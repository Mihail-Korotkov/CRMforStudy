{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — WebDevTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'users/css/registration.css' %}" />
</head>
<body>
<div class="container">

  <!-- ЛОГОТИП -->
  <div class="logo-area">
    <div class="logo-icon"><i class="fas fa-code"></i></div>
    <div class="logo-text">dev<span>Tracker</span></div>
  </div>

  <!-- КАРТОЧКА РЕГИСТРАЦИИ -->
  <div class="register-card">
    <h1>Создать аккаунт</h1>
    <p class="subtitle">Присоединяйтесь к сообществу разработчиков</p>

    <form id="registerForm" onsubmit="return false;">
      <!-- Имя -->
      <div class="form-group">
        <label for="fullName"><i class="fas fa-user"></i> Имя и фамилия</label>
        <input type="text" id="fullName" placeholder="Алексей Иванов" required />
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="email" placeholder="example@mail.com" required />
      </div>

      <!-- Пароль -->
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Пароль</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Минимум 8 символов" required />
          <button type="button" class="toggle-password" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Повтор пароля -->
      <div class="form-group">
        <label for="confirmPassword"><i class="fas fa-lock"></i> Подтвердите пароль</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Повторите пароль" required />
          <button type="button" class="toggle-password" id="toggleConfirmPassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Согласие -->
      <div class="checkbox-group">
        <input type="checkbox" id="agree" required />
        <label for="agree">
          Я принимаю <a href="#">условия использования</a> и <a href="#">политику конфиденциальности</a>
        </label>
      </div>

      <!-- Кнопка -->
      <button type="submit" class="btn-primary" id="registerBtn">
        <i class="fas fa-user-plus"></i> Зарегистрироваться
      </button>
    </form>

    <!-- Разделитель -->
    <div class="divider">
      <span>или продолжите с</span>
    </div>

    <!-- Социальные кнопки -->
    <div class="social-buttons">
      <button class="social-btn google">
        <i class="fab fa-google"></i> Google
      </button>
      <button class="social-btn github">
        <i class="fab fa-github"></i> GitHub
      </button>
    </div>

    <!-- Ссылка на вход -->
    <div class="login-link">
      Уже есть аккаунт? <a href="#">Войти</a>
    </div>
  </div>

</div>

<script>
  // ========== ПОКАЗ/СКРЫТИЕ ПАРОЛЯ ==========
  document.querySelectorAll('.toggle-password').forEach(button => {
    button.addEventListener('click', function() {
      const input = this.closest('.password-wrapper').querySelector('input');
      const icon = this.querySelector('i');

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });
  });

  // ========== РЕГИСТРАЦИЯ ==========
  const registerBtn = document.getElementById('registerBtn');
  const fullName = document.getElementById('fullName');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const confirmPassword = document.getElementById('confirmPassword');
  const agree = document.getElementById('agree');

  registerBtn.addEventListener('click', function() {
    // Простая валидация
    if (!fullName.value.trim()) {
      alert('Введите имя и фамилию');
      fullName.focus();
      return;
    }

    if (!email.value.trim() || !email.value.includes('@')) {
      alert('Введите корректный email');
      email.focus();
      return;
    }

    if (password.value.length < 8) {
      alert('Пароль должен содержать минимум 8 символов');
      password.focus();
      return;
    }

    if (password.value !== confirmPassword.value) {
      alert('Пароли не совпадают');
      confirmPassword.focus();
      return;
    }

    if (!agree.checked) {
      alert('Примите условия использования');
      return;
    }

    // Имитация успешной регистрации
    const originalText = this.innerHTML;
    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Регистрация...';
    this.disabled = true;

    setTimeout(() => {
      alert('✅ Регистрация прошла успешно!');
      this.innerHTML = originalText;
      this.disabled = false;
    }, 1500);
  });

  // Отправка по Enter
  document.getElementById('registerForm').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      registerBtn.click();
    }
  });
</script>
</body>
</html>
